<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso al Sistema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="login-card">

    <header class="card-header">
      <div>
        <span class="eyebrow">ACCESO AUTENTICADO</span>
        <h1>Ingreso al Sistema</h1>
      </div>
      <div class="tls-badge">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2" fill="currentColor"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="15.5" r="1.5" fill="#e6f6ee" stroke="none"/>
        </svg>
        <span>Cifrado TLS 1.3</span>
      </div>
    </header>

    <form action="#" method="post">

      <label class="field-label">Selecciona tu perfil universitario</label>
      <div class="profile-tabs">
        <button type="button" class="tab active">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/>
          </svg>
          Estudiante
        </button>
        <button type="button" class="tab">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="12" cy="10.5" r="3"/>
            <path d="M6.5 20c.6-3 2.7-4.5 5.5-4.5s4.9 1.500 5.500 4.500"/>
          </svg>
          Académico
        </button>
        <button type="button" class="tab">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8" width="18" height="13" rx="2"/>
            <path d="M9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
            <circle cx="9" cy="13" r="1.600"/>
            <path d="M6.500 18c.4-1.600 1.200-2.400 2.500-2.400s2.100.8 2.500 2.400M14 13h4M14 16.500h4"/>
          </svg>
          Aspirante / Admin
        </button>
      </div>

      <div class="label-row">
        <label class="field-label" for="codigo">Código de estudiante</label>
        <span class="hint">9 dígitos numéricos</span>
      </div>
      <div class="input-box">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="14" rx="2"/>
          <path d="M9 7V4h6v3"/>
          <circle cx="9" cy="13" r="1.600"/>
          <path d="M6.500 18c.4-1.600 1.200-2.400 2.500-2.400s2.100.8 2.500 2.400M14 12.500h4M14 16h4"/>
        </svg>
        <input type="text" id="codigo" placeholder="Ej. 219482019" maxlength="9" inputmode="numeric">
      </div>

      <div class="label-row">
        <label class="field-label" for="nip">NIP / Contraseña</label>
        <a href="#" class="link-blue">¿Olvidaste tu NIP?</a>
      </div>
      <div class="input-box">
        <svg viewBox="0 0 28 24" width="28" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7" cy="12" r="4"/>
          <path d="M11 12h14M21 12v3.500M25 12v3"/>
        </svg>
        <input type="password" id="nip" placeholder="Ingresa tu clave de acceso">
        <button type="button" class="eye-btn" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.500 12S5.500 5 12 5s10.500 7 10.500 7-4 7-10.500 7S1.500 12 1.500 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="captcha">
        <label class="captcha-left">
          <input type="checkbox" class="checkbox big">
          <span>Verificación de identidad humana (Anti-Bot UdeG)</span>
        </label>
        <div class="ssl">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M12 2 4 5v6c0 5 3.400 9.300 8 11 4.600-1.700 8-6 8-11V5z" fill="#1c2b45"/>
            <path d="M12 2v20c4.600-1.700 8-6 8-11V5z" fill="#fff" opacity=".9"/>
            <path d="M12 2 4 5v6c0 5 3.400 9.300 8 11z" fill="#1c2b45"/>
          </svg>
          <span>SSL SEGURO</span>
        </div>
      </div>

      <div class="remember-row">
        <label class="remember">
          <input type="checkbox" class="checkbox">
          <span>Recordar mi código en este equipo</span>
        </label>
        <span class="hint">Cierre auto: 15 min</span>
      </div>

      <button type="submit" class="btn-submit">
        Acceder a mi Cuenta SIIAU
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h16M13 5l7 7-7 7"/>
        </svg>
      </button>

      <footer class="card-footer">
        <p>
          ¿Es tu primera vez en el portal?
          <a href="#" class="link-blue">Generar o recuperar NIP institucional</a>
        </p>
        <a href="#" class="guide">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.200 9.200a2.800 2.800 0 1 1 4 2.500c-.9.500-1.200 1-1.200 1.800M12 17h.01"/>
          </svg>
          Guía paso a paso
        </a>
      </footer>

    </form>
  </main>

</body>
</html>
